  scrollbar-width:none

@keyframes wigglePop{
  0%{
    transform:scale(1) rotate(0deg)
  }

  25%{
    transform:scale(1.08) rotate(-2.5deg)
  }

  50%{
    transform:scale(1.12) rotate(2.5deg)
  }

  75%{
    transform:scale(1.06) rotate(-1.5deg)
  }

  100%{
    transform:scale(1.05) rotate(0deg)
  }
}

@keyframes floatSoft{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-5px)
  }
}

@keyframes pulseRing{
  0%{
    box-shadow:0 0 0 0 rgba(255,122,26,.55)
  }

  100%{
    box-shadow:0 0 0 14px rgba(255,122,26,0)
  }
}

.card-active{
  animation:wigglePop .55s ease-in-out, pulseRing .7s ease-out;
  border-color:#FF7A1A !important;
  box-shadow:0 14px 28px rgba(255,122,26,.32), 0 0 0 4px #FFD166 !important;
  z-index:2;
}

.float-soft{
  animation:floatSoft 3s ease-in-out infinite
}

@keyframes quizShake{
  0%,100%{
    transform:translateX(0)
